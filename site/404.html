<style>
:root{--bg:#0a0b0d;--bg2:#0f1114;--linha:#252a31;--linha2:#343b45;--tx:#eef1f4;--tx2:#c4ccd5;--fraco:#9aa5b1;--y:#ffe500;--y-tinta:#171400;
  --f-disp:"Anton","Impact","Arial Narrow Bold",sans-serif;--f-ui:"Archivo",system-ui,"Segoe UI",Roboto,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx2);font-family:var(--f-ui);font-size:17px;line-height:1.6}
:focus-visible{outline:3px solid var(--y);outline-offset:3px;border-radius:4px}
.caixa{width:100%;max-width:1240px;margin:0 auto;padding-inline:32px}
@media (max-width:600px){.caixa{padding-inline:16px}}
header{border-bottom:1px solid var(--linha)}
header .caixa{display:flex;align-items:center;min-height:60px}
.marca{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);font-weight:800;font-size:20px}
.marca b{color:var(--y)}
.marca i{width:14px;height:23px;border-radius:4px;background:var(--y);box-shadow:0 0 0 3px rgba(255,229,0,.14)}
main{flex:1;display:flex;align-items:center;padding:64px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 120px)}
.slate{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco)}
.slate::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--y)}
.slate b{color:var(--y);font-weight:600}
h1{margin:0;font-family:var(--f-disp);font-weight:400;text-transform:uppercase;color:var(--tx);font-size:clamp(2.6rem,1.4rem + 4.4vw,5rem);line-height:1;max-width:16ch}
p{max-width:52ch;margin:20px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;padding:14px 22px;border-radius:10px;font-weight:700;font-size:16px;text-decoration:none;border:1px solid transparent;line-height:1.2}
.btn-pri{background:var(--y);color:var(--y-tinta)}
.btn-sec{border-color:var(--linha2);color:var(--tx)}
.btn-sec:hover{border-color:var(--y)}
footer{border-top:1px solid var(--linha);padding:20px 0;font-size:14px;color:var(--fraco)}
footer a{color:var(--tx2)}
</style>

      <a class="btn btn-sec" href="https://github.com/Corrar/ClipPro" target="_blank" rel="noopener">Ver no GitHub</a>

</html>
